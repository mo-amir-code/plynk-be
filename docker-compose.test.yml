services:
  test-db:
    image: postgres:15-alpine
    container_name: plynk-test-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: plynk_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d plynk_test"]
      interval: 5s
      timeout: 5s
      retries: 5
